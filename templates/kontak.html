{% extends 'base.html' %}

{% block title %}Masukan & Saran Kantin{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Kirim Masukan & Saran</h2>
      <p>Bantu kami membuat menu kantin makin enak.</p>
    </div>
    <form action="{{ url_for('kontak') }}" method="POST">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" class="form-control" value="{{ request.form.get('nama', '') }}" placeholder="Contoh: Faiz" />
      </div>
      <div class="form-group">
        <label for="pesan">Pesan atau Masukan Menu</label>
        <textarea id="pesan" name="pesan" class="form-control" placeholder="Tuliskan masukan untuk kantin kampus...">{{ request.form.get('pesan', '') }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Kirim Masukan</button>
    </form>
  </div>
</div>
{% endblock %}
