{% extends 'base.html' %}

{% block title %}Login Admin Kantin{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Login Admin Kantin</h2>
      <p>Masuk untuk mengelola kantin.</p>
    </div>
    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Masukkan username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Masuk (Login)</button>
    </form>
  </div>
</div>
{% endblock %}
